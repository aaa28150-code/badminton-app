<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>バドミントン組み合わせ</title><style>body{font-family:system-ui,sans-serif;background:#f3f6f8;color:#18252e;margin:0;padding:18px}main{max-width:700px;margin:auto}h1{font-size:1.5rem}section{background:white;padding:16px;border-radius:14px;margin:12px 0;box-shadow:0 2px 8px #0001}.fields{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}label{font-size:.9rem}input{width:100%;box-sizing:border-box;padding:12px;font-size:1.1rem;border:1px solid #aab9c3;border-radius:8px;margin-top:5px}button{padding:13px 18px;border:0;border-radius:10px;background:#096d55;color:white;font-size:1rem;margin:8px 8px 0 0}button.secondary{background:#465e70}.match{border-top:1px solid #e0e6eb;padding:10px 0}.rest{color:#a0460d;font-weight:600}.note{font-size:.85rem;color:#52636c}</style></head><body><main><h1>🏸 バドミントン組み合わせ</h1><section><div class="fields"><label>参加人数<input id="players" type="number" min="4" max="100" value="13"></label><label>コート数<input id="courts" type="number" min="1" max="20" value="3"></label><label>試合数<input id="rounds" type="number" min="1" max="100" value="3"></label></div><button onclick="generate()">組み合わせ作成</button><button class="secondary" onclick="copyResult()">結果をコピー</button><p class="note">番号1から参加人数までを使用。毎試合の休みを公平にし、ペアの重複を減らします。</p></section><div id="results"></div></main><script>let output='';function generate(){let n=+document.getElementById('players').value,c=+document.getElementById('courts').value,r=+document.getElementById('rounds').value;if(!Number.isInteger(n)||!Number.isInteger(c)||!Number.isInteger(r)||n<4||n>100||c<1||c>20||r<1||r>100){alert('入力値を確認してください');return}let active=Math.min(c,Math.floor(n/4))*4;if(active<4){alert('4人以上必要です');return}let rests=Array(n).fill(0),played=Array(n).fill(0),pairs=Array.from({length:n},()=>Array(n).fill(0)),opponents=Array.from({length:n},()=>Array(n).fill(0));let html='',lines=[];for(let round=1;round<=r;round++){let ids=Array.from({length:n},(_,i)=>i);ids.sort((a,b)=>(played[a]-played[b])||Math.random()-.5);let selected=ids.slice(0,active),rest=ids.slice(active);rest.forEach(i=>rests[i]++);selected.forEach(i=>played[i]++);let best=null,bestScore=Infinity;for(let attempt=0;attempt<250;attempt++){let pool=[...selected].sort(()=>Math.random()-.5),teams=[];while(pool.length){let a=pool.pop(),bi=0,bs=Infinity;for(let k=0;k<pool.length;k++){let s=pairs[a][pool[k]]*100+Math.random()*12;if(s<bs){bs=s;bi=k}}let b=pool.splice(bi,1)[0];teams.push([a,b])}let games=[],score=teams.reduce((s,[a,b])=>s+pairs[a][b]*100,0);while(teams.length){let t=teams.pop(),bi=0,bs=Infinity;for(let k=0;k<teams.length;k++){let u=teams[k],s=opponents[t[0]][u[0]]+opponents[t[0]][u[1]]+opponents[t[1]][u[0]]+opponents[t[1]][u[1]]+Math.random();if(s<bs){bs=s;bi=k}}let u=teams.splice(bi,1)[0];score+=bs*5;games.push([t,u])}if(score<bestScore){bestScore=score;best=games}}for(let [[a,b],[d,e]] of best){pairs[a][b]++;pairs[b][a]++;for(let x of [a,b])for(let y of [d,e]){opponents[x][y]++;opponents[y][x]++}}let line='第'+round+'試合\n';html+='<section><h2>第'+round+'試合</h2>';best.forEach(([[a,b],[d,e]],k)=>{let s=`コート${k+1}：${a+1}・${b+1} 対 ${d+1}・${e+1}`;line+=s+'\n';html+='<div class="match"><b>コート'+(k+1)+'</b><br>'+(a+1)+'・'+(b+1)+'　対　'+(d+1)+'・'+(e+1)+'</div>'});let restText=rest.map(i=>i+1).sort((a,b)=>a-b).join('、');line+='休み：'+(restText||'なし');html+='<p class="rest">休み：'+(restText||'なし')+'</p></section>';lines.push(line)}output=lines.join('\n\n');document.getElementById('results').innerHTML=html}async function copyResult(){if(!output){alert('先に組み合わせを作成してください');return}try{await navigator.clipboard.writeText(output);alert('コピーしました。LINEに貼り付けられます')}catch(e){let ta=document.createElement('textarea');ta.value=output;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();alert('コピーしました')}}generate();</script></body></html>
